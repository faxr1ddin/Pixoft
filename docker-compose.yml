services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pixoft
      POSTGRES_USER: pixoft
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  web:
    build: .
    image: pixoft-api:latest
    container_name: pixoft-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://pixoft:${DB_PASSWORD}@db:5432/pixoft
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - db

volumes:
  postgres_data:
